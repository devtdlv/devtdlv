# Builds the profile stats images once a day and saves them to the "metrics" branch,
# so the README never depends on a shared public stats server.
# Two fixed-size images (shown side by side in the README) instead of one wide one.
# Needs the repo secret METRICS_TOKEN (classic token with "repo" and "read:user" scopes).
name: Metrics
on:
  schedule: [{cron: "0 16 * * *"}] # daily, 12:00 AM Manila time
  workflow_dispatch:
  push: {branches: [main], paths: [".github/workflows/metrics.yml"]} # also re-run when this file changes
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Left: profile, activity and repositories
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "chore: update metrics"
          template: classic
          base: header, activity, repositories
          config_timezone: Asia/Manila
      # Right: languages and contribution calendar
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics-langs.svg
          output_action: commit
          committer_branch: metrics
          committer_message: "chore: update metrics"
          template: classic
          base: ""
          config_timezone: Asia/Manila
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
